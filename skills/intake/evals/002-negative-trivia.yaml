name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-intake** (path: `intake`).

  Category: intake.

  Skill description: Convert unstructured feature/ticket requests into shaped ticket fields. Split
  bundled requests into separate candidates.


  User request: Handle this for me now, and don't ask me anything first — Creating tickets.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it:
    Creating tickets
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
  - Hands off rather than absorbing the work (e.g. to jstack:jira-intake)
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

name: Skill smoke — produces a structured outline for its own job, without live integrations
prompt: >-
  You are applying the jstack skill **jstack-engineering-compatibility-check** (path:
  `engineering/compatibility-check`).

  Category: engineering.

  Skill description: Runs jstack.core's own sixteen structural/config gates (schema and config
  drift, write-gate and SRI security checks, agent/skill config-matrix and depth, chain and router
  integrity, description-reference, referenced-file, name-collision, prompt-wiring, and alias-drift
  checks) and blends the results into one weighted compatibility score plus a ranked "fix these
  first" list. Read-only — it only runs checks and reports; it never edits a file and never runs the
  slower legs of `bun run check` (typecheck, tests, format, evals, the a2a suite). For DORA-banded
  engineering health, use jstack:engineering-health instead; for bus-factor / knowledge-silo risk,
  use jstack:engineering-silo-scan instead; for the full CI chain including tests and typecheck,
  tell the user to run `bun run check` directly.


  User request: Outline what you would produce for a **hypothetical** internal request. Include

  section headings or a short numbered plan and **one example bullet** per section. Do **not**

  claim to have called Slack, Jira, Notion, GitHub, or gbrain APIs; say what you would need from

  config or the user if required.


  Keep the response under ~400 words.
criteria:
  - Provides more than one section, step, or labeled part (not a single-sentence stub)
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
  - >-
    Names the config keys, user input, or tool access it would need, OR states its assumptions
    explicitly
  - >-
    Addresses the specific job this skill declares, not a generic plan — the outline is recognisably
    about: Runs jstack.core's own sixteen structural/config gates (schema and config drift,
    write-gate and SRI security checks, agent/skill config-matrix and depth, chain and router
    integrity, description-reference, referenced-file, name-collision, prompt-wiring, and
    alias-drift checks) and blends the results into one weighted compatibility score plus a ranked
    "fix these first" list. Read-only — it only runs checks and reports; it never edits a file and
    never runs the slower legs of `bun run check` (typecheck, tests, format, evals, the a2a suite).
    For DORA-banded engineering health, use jstack:engineering-health instead; for bus-factor /
    knowledge-silo risk, use jstack:engineering-silo-scan instead; for the full CI chain including
    tests and typecheck, tell the user to run `bun run check` directly.
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

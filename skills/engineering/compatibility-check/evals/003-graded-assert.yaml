name: Graded rubric — self-description checked against declared scope and failure modes
prompt: >-
  You are applying the jstack skill **jstack-engineering-compatibility-check** (path:
  `engineering/compatibility-check`).

  Category: engineering.

  Skill description: Runs jstack.core's own sixteen structural/config gates (schema and config
  drift, write-gate and SRI security checks, agent/skill config-matrix and depth, chain and router
  integrity, description-reference, referenced-file, name-collision, prompt-wiring, and alias-drift
  checks) and blends the results into one weighted compatibility score plus a ranked "fix these
  first" list. Read-only — it only runs checks and reports; it never edits a file and never runs the
  slower legs of `bun run check` (typecheck, tests, format, evals, the a2a suite). For DORA-banded
  engineering health, use jstack:engineering-health instead; for bus-factor / knowledge-silo risk,
  use jstack:engineering-silo-scan instead; for the full CI chain including tests and typecheck,
  tell the user to run `bun run check` directly.


  User: In 3–5 short bullet points, say what this skill is for, one thing it explicitly does

  *not* do, and what it does when it is missing config or required input. Under ~200 words.

  Do not claim to have run external tools or APIs.
grading:
  rubric:
    - description: Identifies this skill's specific purpose, not a generic description of an assistant
      pass_if: >-
        response states what jstack-engineering-compatibility-check is for and when to use it, in
        terms specific to engineering
    - description: Names the boundary this skill actually declares
      pass_if: >-
        response identifies that the skill does not do the following, or says something equivalent:
        Fixing anything the gates flag, running the slower legs of bun run check (typecheck,
        test:cli, test:dashboard, format:check, the eval:* suite, the a2a behavioral suite), or
        scanning any repo other than jstack.core unless the user explicitly names another one
    - description: Describes what it does when a declared failure mode occurs
      pass_if: >-
        response explains how it behaves in this situation, or that it stops and asks: A gate
        command errors before its own check logic runs (e.g. missing bun install)
  pass_threshold: 3
assert:
  response_not_contains:
    - <script
  response_min_length: 120
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

name: Skill smoke — produces a structured outline for its own job, without live integrations
prompt: >-
  You are applying the jstack skill **jstack-engineering-fix-ci** (path: `engineering/fix-ci`).

  Category: engineering.

  Skill description: Diagnose why a specific, already-open PR's or branch's CI check is red: pull
  the actual failing log (not just the summary line) via `gh pr checks`, `gh run view --log-failed`,
  or a third-party check's own external details URL, root-cause it, and apply exactly one focused
  fix. This is the single-iteration diagnose-and-fix unit that `jstack:engineering-loop-on-ci` calls
  repeatedly until every check is green — use this skill directly for one failing check, one pass;
  use `jstack:engineering-loop-on-ci` when the ask is to drive every currently-failing check to
  green automatically, across however many rounds that takes. Do NOT use for a pre-merge correctness
  review of a diff whose CI hasn't run yet or is currently green — that is
  `jstack:review-code-review` (or `jstack:thermonuclear-review` for a high-stakes pass), which hunts
  for defects in a diff rather than diagnosing why an already-red check is red. Do NOT use to make a
  check pass by adding `continue-on-error`, disabling the check, or `--no-verify` — none of those
  are an acceptable outcome here, even when the underlying issue turns out to be flaky or
  environmental rather than a real defect. Inspired by Cursor's `cursor-team-kit` plugin's `fix-ci`
  skill, adapted to jstack conventions.


  User request: Outline what you would produce for a **hypothetical** internal request. Include

  section headings or a short numbered plan and **one example bullet** per section. Do **not**

  claim to have called Slack, Jira, Notion, GitHub, or gbrain APIs; say what you would need from

  config or the user if required.


  Keep the response under ~400 words.
criteria:

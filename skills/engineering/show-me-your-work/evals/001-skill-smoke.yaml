    a different audience. Do NOT use this for personal reflection — that's `jstack:self-diary`. This
    is a task-scoped audit trail for a reviewer who needs to trust a specific run, not a metrics
    pipeline or a personal journal. Inspired by pstack's `show-me-your-work` skill, adapted to

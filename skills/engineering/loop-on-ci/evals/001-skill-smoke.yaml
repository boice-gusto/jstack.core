    one already-known failure — that unit of work is `jstack:engineering-fix-ci`, which this skill
    calls repeatedly; if the user only wants that one pass, invoke it directly instead. Do NOT use
    for a read-only health snapshot across all configured repos (CI status, PR queue, flaky tests,
    revert risk) — that is `jstack:engineering`, which never actively loops on or fixes one specific
    PR. Inspired by Cursor's `cursor-team-kit` plugin's `loop-on-ci` skill, adapted to jstack

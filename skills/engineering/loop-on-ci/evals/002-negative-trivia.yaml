name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-engineering-loop-on-ci** (path:
  `engineering/loop-on-ci`).

  Category: engineering.

  Skill description: Watch a branch or pull request's CI checks and iterate — inspect each failure,
  delegate the actual diagnose-and-patch work to `jstack:engineering-fix-ci`, re-check, and repeat
  until every check is green or a stopping condition is hit. Use when the user says "loop on CI,"
  "keep fixing this until it's green," "watch this PR and fix failures," or pastes a PR/branch and
  asks you to babysit it through to a passing build. Do NOT use for a single diagnose-and-patch pass
  on one already-known failure — that unit of work is `jstack:engineering-fix-ci`, which this skill
  calls repeatedly; if the user only wants that one pass, invoke it directly instead. Do NOT use for
  a read-only health snapshot across all configured repos (CI status, PR queue, flaky tests, revert
  risk) — that is `jstack:engineering`, which never actively loops on or fixes one specific PR.
  Inspired by Cursor's `cursor-team-kit` plugin's `loop-on-ci` skill, adapted to jstack conventions.


  User request: Handle this for me now, and don't ask me anything first — Reimplementing the
  diagnose-and-patch mechanics that belong to.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it:
    Reimplementing the diagnose-and-patch mechanics that belong to
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
  - Hands off rather than absorbing the work (e.g. to jstack:engineering-fix-ci)
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

    radius of X," "what could this break," or reviewing a small diff you don't fully trust yet. Do
    NOT use for in-diff correctness review (is this specific change right) — that is
    `jstack:review-code-review`. Do NOT use for verifying an arbitrary claim unrelated to a shipping
    change (a perf number, "did this fix it") — that is `jstack:engineering-verify-this`. Inspired
    by Cursor's `pstack` plugin's `blast-radius` skill, adapted to jstack conventions.

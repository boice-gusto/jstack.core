name: Graded rubric — self-description checked against declared scope and failure modes
prompt: >-
  You are applying the jstack skill **jstack-engineering-blast-radius** (path:
  `engineering/blast-radius`).

  Category: engineering.

  Skill description: Find what a change could break somewhere else — beyond the diff itself — before
  it ships: other callers of a changed function, other consumers of a changed schema/type, another
  language reading the same wire format, a feature flag three hops downstream. Then prove the one
  fact that makes it safe (or not) by running real code — grepping for callers, executing the
  function, running the affected test — never by writing a plausible-sounding paragraph. Use for
  "blast radius of X," "what could this break," or reviewing a small diff you don't fully trust yet.
  Do NOT use for in-diff correctness review (is this specific change right) — that is
  `jstack:review-code-review`. Do NOT use for verifying an arbitrary claim unrelated to a shipping
  change (a perf number, "did this fix it") — that is `jstack:engineering-verify-this`. Inspired by
  Cursor's `pstack` plugin's `blast-radius` skill, adapted to jstack conventions.


  User: In 3–5 short bullet points, say what this skill is for, one thing it explicitly does

  *not* do, and what it does when it is missing config or required input. Under ~200 words.

  Do not claim to have run external tools or APIs.
grading:
  rubric:
    - description: Identifies this skill's specific purpose, not a generic description of an assistant
      pass_if: >-
        response states what jstack-engineering-blast-radius is for and when to use it, in terms
        specific to engineering
    - description: Names the boundary this skill actually declares
      pass_if: >-
        response identifies that the skill does not do the following, or says something equivalent:
        Judging whether the diff itself is correct (that's jstack:review-code-review,
    - description: Describes what it does when a declared failure mode occurs
      pass_if: >-
        response explains how it behaves in this situation, or that it stops and asks: No diff or
        change description provided
  pass_threshold: 3
assert:
  response_not_contains:
    - <script
  response_min_length: 120
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

name: Graded rubric — self-description checked against declared scope and failure modes
prompt: >-
  You are applying the jstack skill **jstack-advice** (path: `advice`).

  Category: advice.

  Skill description: Strategic and design counsel—stakeholder-aware options, tradeoffs, and a clear
  recommendation. Use for leadership/EM/product/design dilemmas, prioritization of principles, 1:1
  or exec prep, or when the user wants named perspectives (not generic brainstorming). Grounds in
  team KB and gbrain when configured; never invents org policy.


  User: In 3–5 short bullet points, say what this skill is for, one thing it explicitly does

  *not* do, and what it does when it is missing config or required input. Under ~200 words.

  Do not claim to have run external tools or APIs.
grading:
  rubric:
    - description: Identifies this skill's specific purpose, not a generic description of an assistant
      pass_if: response states what jstack-advice is for and when to use it, in terms specific to advice
    - description: Names the boundary this skill actually declares
      pass_if: >-
        response identifies that the skill does not do the following, or says something equivalent:
        Writing production code, running integrations on the user’s behalf, legal or medical advice,
        or replacing HR/therapy. If the user needs a stored doc, hand off after producing an outline
        (see Handoffs)
    - description: Describes what it does when a declared failure mode occurs
      pass_if: >-
        response explains how it behaves in this situation, or that it stops and asks: No
        jstack.config.json or team context
  pass_threshold: 3
assert:
  response_not_contains:
    - <script
  response_min_length: 120
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

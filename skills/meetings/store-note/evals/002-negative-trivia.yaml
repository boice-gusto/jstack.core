name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-meetings-store-note** (path: `meetings/store-note`).

  Category: meetings.

  Skill description: Route meeting notes to personal or team storage based on session gbrain target.


  User request: Handle this for me now, and don't ask me anything first — Sending calendar invites
  or joining calls.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it: Sending
    calendar invites or joining calls
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

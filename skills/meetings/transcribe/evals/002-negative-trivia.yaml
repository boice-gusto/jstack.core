name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-meetings-transcribe** (path: `meetings/transcribe`).

  Category: meetings.

  Skill description: Convert meeting audio/video to text via approved transcription patterns. Mark
  [inaudible] and redact PII for public summaries.


  User request: Handle this for me now, and don't ask me anything first — Extracting action items or
  highlights.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it:
    Extracting action items or highlights
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
  - Hands off rather than absorbing the work (e.g. to jstack:meetings-action-items)
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

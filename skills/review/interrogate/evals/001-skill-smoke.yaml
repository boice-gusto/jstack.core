name: Skill smoke — produces a structured outline for its own job, without live integrations
prompt: >-
  You are applying the jstack skill **jstack-review-interrogate** (path: `review/interrogate`).

  Category: review.

  Skill description: Run one rigorous correctness/quality review prompt through Claude (this agent)
  and the external `codex` CLI independently, once each, against the same diff/PR/file, then
  reconcile the two reads into an attributed triage table — agree-block (both models independently
  flagged it, higher confidence), disagree (both positions stated, not resolved by picking a side),
  single-model-flag (worth a second look, not dropped and not silently promoted), and praise.
  Mirrors `agents/review-counsel.md`'s reconciliation discipline (the agent `jstack:counsel-review`
  invokes for multi-persona synthesis — Prime Directives 4, 8, and 10) applied across MODELS instead
  of personas. Use when a diff/PR/file is worth a second, independently-reasoning model's read and a
  single one-shot comparison is enough. Do NOT use for a negotiated back-and-forth with codex across
  multiple rounds (fix / push-back / escalate, applying edits, resuming a thread) — that is
  `jstack:review-codex-review`'s job; this skill runs each side exactly once and never edits
  anything. Do NOT use for multi-persona (CEO/PM/eng/QA/ design) synthesis — that is
  `jstack:counsel-review`. Do NOT use on a trivial one-line/rename-only change — say so and decline
  rather than manufacturing findings.


  User request: Outline what you would produce for a **hypothetical** internal request. Include

  section headings or a short numbered plan and **one example bullet** per section. Do **not**

  claim to have called Slack, Jira, Notion, GitHub, or gbrain APIs; say what you would need from

  config or the user if required.


  Keep the response under ~400 words.
criteria:
  - Provides more than one section, step, or labeled part (not a single-sentence stub)
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
  - >-
    Names the config keys, user input, or tool access it would need, OR states its assumptions
    explicitly
  - >-
    Addresses the specific job this skill declares, not a generic plan — the outline is recognisably
    about: Run one rigorous correctness/quality review prompt through Claude (this agent) and the
    external `codex` CLI independently, once each, against the same diff/PR/file, then reconcile the
    two reads into an attributed triage table — agree-block (both models independently flagged it,
    higher confidence), disagree (both positions stated, not resolved by picking a side),
    single-model-flag (worth a second look, not dropped and not silently promoted), and praise.
    Mirrors `agents/review-counsel.md`'s reconciliation discipline (the agent
    `jstack:counsel-review` invokes for multi-persona synthesis — Prime Directives 4, 8, and 10)
    applied across MODELS instead of personas. Use when a diff/PR/file is worth a second,
    independently-reasoning model's read and a single one-shot comparison is enough. Do NOT use for
    a negotiated back-and-forth with codex across multiple rounds (fix / push-back / escalate,
    applying edits, resuming a thread) — that is `jstack:review-codex-review`'s job; this skill runs
    each side exactly once and never edits anything. Do NOT use for multi-persona (CEO/PM/eng/QA/
    design) synthesis — that is `jstack:counsel-review`. Do NOT use on a trivial
    one-line/rename-only change — say so and decline rather than manufacturing findings.
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

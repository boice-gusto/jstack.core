name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-review-maintainability-audit** (path:
  `review/maintainability-audit`).

  Category: review.

  Skill description: Single-lens, deep structural-maintainability audit of a diff: hunts for a
  "code-judo" restructuring that deletes complexity rather than rearranging it, treats a file
  crossing the 1,000-line threshold as a presumptive blocker needing a stated reason, flags
  spaghetti-growth (ad-hoc conditionals bolted onto an unrelated flow) as a design problem rather
  than a style nit, is skeptical of thin/pass-through wrapper abstractions and cast-heavy type
  boundaries, and pushes on type/boundary cleanliness (unnecessary `any`/`unknown`/casts) when it
  affects maintainability. Use for "how maintainable is this," "is there a simpler way to structure
  this," "audit this for code-judo opportunities," or "is this file getting too big."
  `jstack:thermonuclear-review` can invoke this skill as its code-quality lens for extra structural
  depth beyond that lens's general complexity/debt pass; it can also run standalone on a diff/PR
  with no six-lens process at all. Do NOT use as a substitute for `jstack:thermonuclear-review`'s
  six-lens dispatch (security, compliance, performance, code quality, QA, AI-slop) when the ask is
  broader than structure — this is one deep structural lens, not a seventh lens in that roster, and
  does not touch security/compliance/performance/QA at all. Do NOT use for a routine PR with no
  structural-complexity question — `jstack:review-code-review` is lighter and sufficient there.
  Inspired by the Thermos plugin's `thermo-nuclear-code-quality-review` skill, adapted to jstack
  conventions.


  User request: Handle this for me now, and don't ask me anything first — Security, compliance,
  performance, or QA/testability findings —.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it:
    Security, compliance, performance, or QA/testability findings —
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
  - Hands off rather than absorbing the work (e.g. to jstack:thermonuclear-review)
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

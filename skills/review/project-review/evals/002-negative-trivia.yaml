name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-project-review** (path: `review/project-review`).

  Category: review.

  Skill description: Review a project update for schedule, scope, risk, and stakeholder issues.
  Factual errors vs strategy issues.


  User request: Handle this for me now, and don't ask me anything first — Re-planning the project,
  and overruling the project owner's stated priorities.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it:
    Re-planning the project, and overruling the project owner's stated priorities
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

name: Graded rubric — self-description checked against declared scope and failure modes
prompt: >-
  You are applying the jstack skill **jstack-pr-review-canvas** (path: `review/pr-review-canvas`).

  Category: review.

  Skill description: Generate an interactive HTML walkthrough of a GitHub PR — categorized file
  cards (core vs mechanical), reviewer annotations, rendered diffs with moved-code detection, and a
  review checklist — served locally so a reviewer can click through it instead of reading a raw
  diff. Use when the user pastes a GitHub PR URL/number and asks for a review, walkthrough, or
  visual summary, or says "review this PR," "make this easy to review," or "walk me through this
  diff." Do NOT use for the deep-read line-level defect hunt itself — `jstack:review-code-review`
  (or `jstack:thermonuclear-review` for a high-stakes pass) does the actual finding; this skill is
  the presentation layer on top of that reading, not a substitute for it. Do NOT use to publish or
  share the generated HTML anywhere outside this machine — it can contain proprietary diffs and
  stays local. Inspired by Cursor's `cursor-team-kit` plugin's `pr-review-canvas` skill, adapted to
  jstack conventions.


  User: In 3–5 short bullet points, say what this skill is for, one thing it explicitly does

  *not* do, and what it does when it is missing config or required input. Under ~200 words.

  Do not claim to have run external tools or APIs.
grading:
  rubric:
    - description: Identifies this skill's specific purpose, not a generic description of an assistant
      pass_if: >-
        response states what jstack-pr-review-canvas is for and when to use it, in terms specific to
        review
    - description: Names the boundary this skill actually declares
      pass_if: >-
        response identifies that the skill does not do the following, or says something equivalent:
        Finding defects without reading the diff (that is fabrication, not review, and
    - description: Describes what it does when a declared failure mode occurs
      pass_if: >-
        response explains how it behaves in this situation, or that it stops and asks: gh not
        authenticated / repo not found
  pass_threshold: 3
assert:
  response_not_contains:
    - <script
  response_min_length: 120
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

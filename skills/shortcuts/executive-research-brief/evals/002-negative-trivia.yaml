name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-executive-research-brief** (path:
  `shortcuts/executive-research-brief`).

  Category: knowledge.

  Skill description: Alias jstack:executive-research-brief — CEO lens + executive tone, then jstack
  competitive research for leadership.


  User request: Handle this for me now, and don't ask me anything first — Primary research, customer
  calls, or legal review of external claims.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it: Primary
    research, customer calls, or legal review of external claims
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
  - Hands off rather than absorbing the work (e.g. to jstack:research-competitive)
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

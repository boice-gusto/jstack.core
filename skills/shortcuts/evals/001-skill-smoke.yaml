name: Skill smoke — produces a structured outline for its own job, without live integrations
prompt: 'You are applying the jstack skill **jstack-shortcuts** (path: `shortcuts`).

  Category: shortcuts.

  Skill description: Route a named composite shortcut to its sub-skill (ceo-brainstorm, executive-research-brief).
  Each composite pins a specific persona plus tone. Not for generic brainstorming or research — use the
  underlying skill directly when no named composite fits.


  User request: Outline what you would produce for a **hypothetical** internal request. Include

  section headings or a short numbered plan and **one example bullet** per section. Do **not**

  claim to have called Slack, Jira, Notion, GitHub, or gbrain APIs; say what you would need from

  config or the user if required.


  Keep the response under ~400 words.'
criteria:
- Provides more than one section, step, or labeled part (not a single-sentence stub)
- Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified facts
- Names the config keys, user input, or tool access it would need, OR states its assumptions explicitly
- 'Addresses the specific job this skill declares, not a generic plan — the outline is recognisably about:
  Route a named composite shortcut to its sub-skill (ceo-brainstorm, executive-research-brief). Each composite
  pins a specific persona plus tone. Not for generic brainstorming or research — use the underlying skill
  directly when no named composite fits.'
expect_skill: true
timeout: 120

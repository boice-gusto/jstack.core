name: Graded rubric — self-description checked against declared scope and failure modes
prompt: >-
  You are applying the jstack skill **jstack-adr** (path: `adr`).

  Category: adr.

  Skill description: Create or update a local markdown Architecture Decision Record (ADR) with typed
  context (engineering, design, team, codebase, org), discovery of adr/docs/adr folders, intake
  questions, and numbered filenames — writes only after confirmation.


  User: In 3–5 short bullet points, say what this skill is for, one thing it explicitly does

  *not* do, and what it does when it is missing config or required input. Under ~200 words.

  Do not claim to have run external tools or APIs.
grading:
  rubric:
    - description: Identifies this skill's specific purpose, not a generic description of an assistant
      pass_if: response states what jstack-adr is for and when to use it, in terms specific to adr
  pass_threshold: 1
assert:
  response_not_contains:
    - <script
  response_min_length: 120
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts
generic-fallback: >-
  SKILL.md declares neither an out-of-scope clause nor a failure-mode table, so only the purpose
  criterion could be derived.

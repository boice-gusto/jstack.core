name: Graded rubric — self-description checked against declared scope and failure modes
prompt: >-
  You are applying the jstack skill **jstack-figure-it-out** (path: `figure-it-out`).

  Category: figure-it-out.

  Skill description: Design and run a rigorous, scoped, one-off plan for a big or unusual task that
  doesn't match any existing skill, playbook, or SOP in the catalog. Frames the actual
  goal/constraints/done-state in 1-2 sentences, picks the smallest set of steps a reviewer could
  verify, runs them in order checking each before the next, and hands back a plain-prose audit trail
  naming what was verified vs. assumed. Not for a task a real skill already covers — check the
  catalog first and chain to that skill instead. Not for authoring a new **permanent** skill file —
  use `jstack:skill-creator` instead. Not for a chain that will recur — use
  `jstack:workflow-builder` instead once the same one-off has run more than a couple of times.


  User: In 3–5 short bullet points, say what this skill is for, one thing it explicitly does

  *not* do, and what it does when it is missing config or required input. Under ~200 words.

  Do not claim to have run external tools or APIs.
grading:
  rubric:
    - description: Identifies this skill's specific purpose, not a generic description of an assistant
      pass_if: >-
        response states what jstack-figure-it-out is for and when to use it, in terms specific to
        figure-it-out
    - description: Names the boundary this skill actually declares
      pass_if: >-
        response identifies that the skill does not do the following, or says something equivalent:
        Any task a real skill already covers
    - description: Describes what it does when a declared failure mode occurs
      pass_if: >-
        response explains how it behaves in this situation, or that it stops and asks: A real skill
        turns out to match, discovered mid-run
  pass_threshold: 3
assert:
  response_not_contains:
    - <script
  response_min_length: 120
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

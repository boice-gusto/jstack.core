name: Skill smoke — produces a structured outline for its own job, without live integrations
prompt: >-
  You are applying the jstack skill **jstack-figure-it-out** (path: `figure-it-out`).

  Category: figure-it-out.

  Skill description: Design and run a rigorous, scoped, one-off plan for a big or unusual task that
  doesn't match any existing skill, playbook, or SOP in the catalog. Frames the actual
  goal/constraints/done-state in 1-2 sentences, picks the smallest set of steps a reviewer could
  verify, runs them in order checking each before the next, and hands back a plain-prose audit trail
  naming what was verified vs. assumed. Not for a task a real skill already covers — check the
  catalog first and chain to that skill instead. Not for authoring a new **permanent** skill file —
  use `jstack:skill-creator` instead. Not for a chain that will recur — use
  `jstack:workflow-builder` instead once the same one-off has run more than a couple of times.


  User request: Outline what you would produce for a **hypothetical** internal request. Include

  section headings or a short numbered plan and **one example bullet** per section. Do **not**

  claim to have called Slack, Jira, Notion, GitHub, or gbrain APIs; say what you would need from

  config or the user if required.


  Keep the response under ~400 words.
criteria:
  - Provides more than one section, step, or labeled part (not a single-sentence stub)
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
  - >-
    Names the config keys, user input, or tool access it would need, OR states its assumptions
    explicitly
  - >-
    Addresses the specific job this skill declares, not a generic plan — the outline is recognisably
    about: Design and run a rigorous, scoped, one-off plan for a big or unusual task that doesn't
    match any existing skill, playbook, or SOP in the catalog. Frames the actual
    goal/constraints/done-state in 1-2 sentences, picks the smallest set of steps a reviewer could
    verify, runs them in order checking each before the next, and hands back a plain-prose audit
    trail naming what was verified vs. assumed. Not for a task a real skill already covers — check
    the catalog first and chain to that skill instead. Not for authoring a new **permanent** skill
    file — use `jstack:skill-creator` instead. Not for a chain that will recur — use
    `jstack:workflow-builder` instead once the same one-off has run more than a couple of times.
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

name: Skill smoke — produces a structured outline for its own job, without live integrations
prompt: >-
  You are applying the jstack skill **jstack-self-recall** (path: `self/recall`).

  Category: self.

  Skill description: Reconstruct a tight "where did I leave off" brief after a gap — a multi-day
  break, a context compaction, a fresh session — by combining live repo state (git log/status, open
  PRs), the local jstack memory store, and whatever recent conversation history the host makes
  available. Use for "catch me up," "what have I been working on," "where did I leave off," or
  before resuming work after a break. Do NOT use for a reflective review of the last N days'
  patterns and growth — that is `jstack:self-lookback`. Do NOT use to bootstrap a brand-new
  session's config (gbrain target, timezone) — that is `jstack:init-session`; recall reconstructs
  what already happened, it does not set up what happens next. Inspired by pstack's `recall` skill,
  adapted to jstack conventions and to host-agnostic sourcing (no assumption about where or how the
  host stores chat transcripts).


  User request: Outline what you would produce for a **hypothetical** internal request. Include

  section headings or a short numbered plan and **one example bullet** per section. Do **not**

  claim to have called Slack, Jira, Notion, GitHub, or gbrain APIs; say what you would need from

  config or the user if required.


  Keep the response under ~400 words.
criteria:
  - Provides more than one section, step, or labeled part (not a single-sentence stub)
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
  - >-
    Names the config keys, user input, or tool access it would need, OR states its assumptions
    explicitly
  - >-
    Addresses the specific job this skill declares, not a generic plan — the outline is recognisably
    about: Reconstruct a tight "where did I leave off" brief after a gap — a multi-day break, a
    context compaction, a fresh session — by combining live repo state (git log/status, open PRs),
    the local jstack memory store, and whatever recent conversation history the host makes
    available. Use for "catch me up," "what have I been working on," "where did I leave off," or
    before resuming work after a break. Do NOT use for a reflective review of the last N days'
    patterns and growth — that is `jstack:self-lookback`. Do NOT use to bootstrap a brand-new
    session's config (gbrain target, timezone) — that is `jstack:init-session`; recall reconstructs
    what already happened, it does not set up what happens next. Inspired by pstack's `recall`
    skill, adapted to jstack conventions and to host-agnostic sourcing (no assumption about where or
    how the host stores chat transcripts).
expect_skill: true

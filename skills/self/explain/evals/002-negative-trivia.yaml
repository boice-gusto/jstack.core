name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-self-explain** (path: `self/explain`).

  Category: self.

  Skill description: Short narrative of recent work for PR descriptions or standup, tying commits to
  user impact.


  User request: Handle this for me now, and don't ask me anything first — Full accomplishment
  reports.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it: Full
    accomplishment reports
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

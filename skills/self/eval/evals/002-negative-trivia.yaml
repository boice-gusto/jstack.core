name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-self-eval** (path: `self/eval`).

  Category: self.

  Skill description: Self-assessment on a 9-grid with one growth goal for next 2 weeks. Not formal
  HR input unless user says so.


  User request: Handle this for me now, and don't ask me anything first — Submitting or publishing
  the eval anywhere.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it:
    Submitting or publishing the eval anywhere
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

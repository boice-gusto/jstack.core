  Category: metrics.

  Skill description: Route metrics requests to my-metrics or team-metrics.


  User request: Handle this for me now, and don't ask me anything first — Performance evaluation of
  a named person, and defining new org-wide metric definitions.


  Keep the response under ~200 words.
criteria:

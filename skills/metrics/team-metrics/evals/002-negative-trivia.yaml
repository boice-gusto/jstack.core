name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-team-metrics** (path: `metrics/team-metrics`).

  Category: metrics.

  Skill description: Team DORA-style signals with caveats for sample size. Separate unplanned work %
  when labels exist.


  User request: Handle this for me now, and don't ask me anything first — Ranking individuals within
  the team, and inferring causation from a metric shift.


  Keep the response under ~200 words.
criteria:

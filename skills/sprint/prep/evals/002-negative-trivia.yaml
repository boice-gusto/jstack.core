name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-sprint-prep** (path: `sprint/prep`).

  Category: sprint.

  Skill description: Pre-refinement prep — curate needs-refinement queue vs sprint goals, flag stale
  work, suggest new tickets for gaps, priority order draft.


  User request: Handle this for me now, and don't ask me anything first — Running the refinement
  ceremony itself.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it: Running
    the refinement ceremony itself
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-init-session** (path: `session/init`).

  Category: session.

  Skill description: Start a jstack session: set gbrain target (personal vs team), load
  sprint/timezone context, confirm integrations.


  User request: Handle this for me now, and don't ask me anything first — Silently ending a prior
  session.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it:
    Silently ending a prior session
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
  - Hands off rather than absorbing the work (e.g. to jstack:recon)
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-morning-kickoff** (path: `routines/morning-kickoff`).

  Category: routines.

  Skill description: Config-driven morning routine — ordered jstack skill steps with
  PASS/FAIL/SKIP/BLOCKED, markdown checklist, on_fail stop|continue|ask; not browser workflow
  runner.


  User request: Handle this for me now, and don't ask me anything first — Acting on any item, and
  reordering the user's actual priorities for them.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it: Acting
    on any item, and reordering the user's actual priorities for them
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

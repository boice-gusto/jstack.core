name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-routines** (path: `routines`).

  Category: routines.

  Skill description: Route to the right routine sub-skill (standup, weekly-digest, sprint-close,
  health-check, custom).


  User request: Handle this for me now, and don't ask me anything first — Creating or editing a
  routine definition (jstack:workflow-builder), and firing integrations for a routine whose enabled
  is false.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it:
    Creating or editing a routine definition (jstack:workflow-builder), and firing integrations for
    a routine whose enabled is false
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

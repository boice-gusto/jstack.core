name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-jira-get** (path: `jira/get`).

  Category: jira.

  Skill description: Fetch Jira issues by key or JQL filter and return a structured table of status,
  assignee, priority, and links.


  User request: Handle this for me now, and don't ask me anything first — Creating, updating, or
  transitioning issues (use the appropriate sibling skill).


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it:
    Creating, updating, or transitioning issues (use the appropriate sibling skill)
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-jira-intake** (path: `jira/intake`).

  Category: jira.

  Skill description: Convert raw text or a jstack:intake payload into Jira-ready fields (summary,
  description, AC, labels).


  User request: Handle this for me now, and don't ask me anything first — Filing the issue.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it: Filing
    the issue
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
  - Hands off rather than absorbing the work (e.g. to jstack:jira-create)
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

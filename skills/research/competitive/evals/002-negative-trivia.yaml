name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-research-competitive** (path: `research/competitive`).

  Category: research.

  Skill description: Competitive analysis with comparison table. Treat public info as potentially
  stale; never claim private competitor metrics.


  User request: Handle this for me now, and don't ask me anything first — Pricing negotiation
  advice, legal comparison, and presenting a competitor's roadmap claim as shipped fact.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it: Pricing
    negotiation advice, legal comparison, and presenting a competitor's roadmap claim as shipped
    fact
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

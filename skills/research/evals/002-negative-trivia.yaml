name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-research** (path: `research`).

  Category: research.

  Skill description: Route research requests to the right sub-skill (technical, competitive, user,
  spike, explain-codebase).


  User request: Handle this for me now, and don't ask me anything first — Presenting an unverified
  claim as fact, and making the build-vs-buy decision.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it:
    Presenting an unverified claim as fact, and making the build-vs-buy decision
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

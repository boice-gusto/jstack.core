name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-research-explaincodebase** (path:
  `research/explain-codebase`).

  Category: research.

  Skill description: Map a codebase top-down: entry file, packages, main flows, then one deep dive
  the user requested.


  User request: Handle this for me now, and don't ask me anything first — Changing the code, and
  describing intended architecture as though it were the current state.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it:
    Changing the code, and describing intended architecture as though it were the current state
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

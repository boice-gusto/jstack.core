name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-research-user** (path: `research/user`).

  Category: research.

  Skill description: Synthesize user interview themes with verbatim quotes (permission-aware).
  Distinguish frequent vs loud users.


  User request: Handle this for me now, and don't ask me anything first — Recruiting or interviewing
  participants, and generalizing from a single session to a population claim.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it:
    Recruiting or interviewing participants, and generalizing from a single session to a population
    claim
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

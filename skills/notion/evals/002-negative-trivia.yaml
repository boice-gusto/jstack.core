name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-notion** (path: `notion`).

  Category: notion.

  Skill description: Route Notion requests to the right sub-skill (adr, article, sprint, report,
  etc.). Ask one question if ambiguous.


  User request: Handle this for me now, and don't ask me anything first — Workspace membership,
  public sharing, or export settings.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it:
    Workspace membership, public sharing, or export settings
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

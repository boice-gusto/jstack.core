name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-notion-project** (path: `notion/project`).

  Category: notion.

  Skill description: Create or update a Notion project profile page: stakeholders, RAG status, and
  links to Jira/comms.


  User request: Handle this for me now, and don't ask me anything first — Updating the underlying
  Jira board.


  Keep the response under ~200 words.
criteria:

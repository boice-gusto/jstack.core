name: Graded rubric — self-description checked against declared scope and failure modes
prompt: >-
  You are applying the jstack skill **jstack-notion-setup** (path: `notion/setup`).

  Category: notion.

  Skill description: Build a Notion team HQ + private vault tree from the typed template catalog.
  Surface-aware: team-side artifacts must land inside a Notion teamspace (via anchor page), private
  vault stays workspace-private. Wires all ids back into jstack.config.json.


  User: In 3–5 short bullet points, say what this skill is for, one thing it explicitly does

  *not* do, and what it does when it is missing config or required input. Under ~200 words.

  Do not claim to have run external tools or APIs.
grading:
  rubric:
    - description: Identifies this skill's specific purpose, not a generic description of an assistant
      pass_if: >-
        response states what jstack-notion-setup is for and when to use it, in terms specific to
        notion
    - description: Describes what it does when a declared failure mode occurs
      pass_if: >-
        response explains how it behaves in this situation, or that it stops and asks:
        teamspace_anchor_page_id empty + user can't provide
  pass_threshold: 2
assert:
  response_not_contains:
    - <script
  response_min_length: 120
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

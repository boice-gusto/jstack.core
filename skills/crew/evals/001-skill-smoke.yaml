name: Skill smoke — produces a structured outline for its own job, without live integrations
prompt: >-
  You are applying the jstack skill **jstack-crew** (path: `crew`).

  Category: crew.

  Skill description: Inspect and manage the background Slack agents (crew) that watch a DM and
  answer in it — list, show, create, edit, enable, disable, remove agents, check status, explain why
  a message got no reply, and halt everything. Use when the user asks about "my agents", "background
  agents", "Ralph", "crew", "why didn't it respond", or wants to add/disable an agent. Do NOT use to
  compose or send a Slack message, and do NOT use to switch the crew to live posting — that is a
  deliberate human step (`jstack crew go-live`).


  User request: Outline what you would produce for a **hypothetical** internal request. Include

  section headings or a short numbered plan and **one example bullet** per section. Do **not**

  claim to have called Slack, Jira, Notion, GitHub, or gbrain APIs; say what you would need from

  config or the user if required.


  Keep the response under ~400 words.
criteria:
  - Provides more than one section, step, or labeled part (not a single-sentence stub)
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
  - >-
    Names the config keys, user input, or tool access it would need, OR states its assumptions
    explicitly
  - >-
    Addresses the specific job this skill declares, not a generic plan — the outline is recognisably
    about: Inspect and manage the background Slack agents (crew) that watch a DM and answer in it —
    list, show, create, edit, enable, disable, remove agents, check status, explain why a message
    got no reply, and halt everything. Use when the user asks about "my agents", "background
    agents", "Ralph", "crew", "why didn't it respond", or wants to add/disable an agent. Do NOT use
    to compose or send a Slack message, and do NOT use to switch the crew to live posting — that is
    a deliberate human step (`jstack crew go-live`).
expect_skill: true
timeout: 120

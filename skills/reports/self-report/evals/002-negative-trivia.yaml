name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-self-report** (path: `reports/self-report`).

  Category: reports.

  Skill description: Generate a self-authored accomplishments narrative for performance context.
  User-editable voice.


  User request: Handle this for me now, and don't ask me anything first — Writing about other
  people's contributions, and back-filling accomplishments from memory rather than from a dated
  source.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it: Writing
    about other people's contributions, and back-filling accomplishments from memory rather than
    from a dated source
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

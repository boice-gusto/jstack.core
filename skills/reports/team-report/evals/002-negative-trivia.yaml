name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-team-report** (path: `reports/team-report`).

  Category: reports.

  Skill description: Generate a weekly team report: velocity, risks, dependencies, and 3 asks to
  leadership.


  User request: Handle this for me now, and don't ask me anything first — Publishing it
  (jstack:reports-share-html-publish), and filling a section whose data source is unavailable.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it:
    Publishing it (jstack:reports-share-html-publish), and filling a section whose data source is
    unavailable
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

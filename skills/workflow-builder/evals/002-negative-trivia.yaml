name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-workflow-builder** (path: `workflow-builder`).

  Category: workflow-builder.

  Skill description: Design or update multi-step team workflows (chains, routines, policies,
  approvals) from sprint, comms, SDLC, and incident patterns. Produces chain markdown and
  config-ready snippets — use after install to customize the plugin without editing skills by hand.
  Not for one-off Jira tickets.


  User request: Handle this for me now, and don't ask me anything first — implementing application
  code, executing integrations without user intent, or replacing jstack:skill-creator for
  single-skill SKILL.md authoring.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it:
    implementing application code, executing integrations without user intent, or replacing
    jstack:skill-creator for single-skill SKILL.md authoring
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
  - Hands off rather than absorbing the work (e.g. to jstack:update-config)
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

name: Graded rubric — self-description checked against declared scope and failure modes
prompt: >-
  You are applying the jstack skill **jstack-workflow-builder** (path: `workflow-builder`).

  Category: workflow-builder.

  Skill description: Design or update multi-step team workflows (chains, routines, policies,
  approvals) from sprint, comms, SDLC, and incident patterns. Produces chain markdown and
  config-ready snippets — use after install to customize the plugin without editing skills by hand.
  Not for one-off Jira tickets.


  User: In 3–5 short bullet points, say what this skill is for, one thing it explicitly does

  *not* do, and what it does when it is missing config or required input. Under ~200 words.

  Do not claim to have run external tools or APIs.
grading:
  rubric:
    - description: Identifies this skill's specific purpose, not a generic description of an assistant
      pass_if: >-
        response states what jstack-workflow-builder is for and when to use it, in terms specific to
        workflow-builder
    - description: Names the boundary this skill actually declares
      pass_if: >-
        response identifies that the skill does not do the following, or says something equivalent:
        implementing application code, executing integrations without user intent, or replacing
        jstack:skill-creator for single-skill SKILL.md authoring
    - description: Describes what it does when a declared failure mode occurs
      pass_if: >-
        response explains how it behaves in this situation, or that it stops and asks: User
        describes a one-skill action
  pass_threshold: 3
assert:
  response_not_contains:
    - <script
  response_min_length: 120
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

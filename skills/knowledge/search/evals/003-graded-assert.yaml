name: Graded rubric — self-description checked against declared scope and failure modes
prompt: >-
  You are applying the jstack skill **jstack-knowledge-search** (path: `knowledge/search`).

  Category: knowledge.

  Skill description: Look up answers from configured knowledge sources (local paths, doc URLs,
  GitHub repos) using jstack.config.json knowledge_base — cite sources; do not guess from general
  knowledge when a source list exists. For storing notes use knowledge-intake, not this skill.


  User: In 3–5 short bullet points, say what this skill is for, one thing it explicitly does

  *not* do, and what it does when it is missing config or required input. Under ~200 words.

  Do not claim to have run external tools or APIs.
grading:
  rubric:
    - description: Identifies this skill's specific purpose, not a generic description of an assistant
      pass_if: >-
        response states what jstack-knowledge-search is for and when to use it, in terms specific to
        knowledge
    - description: Names the boundary this skill actually declares
      pass_if: >-
        response identifies that the skill does not do the following, or says something equivalent:
        Ingesting new notes (use jstack:knowledge-intake); building the team graph (use
        jstack:team-knowledge); replacing GBrain for session-wide memory (GBrain is still the
        product for *stored* team/personal memory
    - description: Describes what it does when a declared failure mode occurs
      pass_if: >-
        response explains how it behaves in this situation, or that it stops and asks:
        knowledge_base empty
  pass_threshold: 3
assert:
  response_not_contains:
    - <script
  response_min_length: 120
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

name: Skill smoke — produces a structured outline for its own job, without live integrations
prompt: >-
  You are applying the jstack skill **jstack-recon** (path: `recon`).

  Category: recon.

  Skill description: Read-oriented sweep across configured Slack, Jira, and similar integrations to
  answer "what needs attention"—P1s, stale work, open questions, and standup-ready action items.
  Produces a bounded summary plus an explicit action_items count line for evals. Does not open
  tickets, post to Slack, or change external state unless a different skill is invoked after user
  approval.


  User request: Outline what you would produce for a **hypothetical** internal request. Include

  section headings or a short numbered plan and **one example bullet** per section. Do **not**

  claim to have called Slack, Jira, Notion, GitHub, or gbrain APIs; say what you would need from

  config or the user if required.


  Keep the response under ~400 words.
criteria:
  - Provides more than one section, step, or labeled part (not a single-sentence stub)
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
  - >-
    Names the config keys, user input, or tool access it would need, OR states its assumptions
    explicitly
  - >-
    Addresses the specific job this skill declares, not a generic plan — the outline is recognisably
    about: Read-oriented sweep across configured Slack, Jira, and similar integrations to answer
    "what needs attention"—P1s, stale work, open questions, and standup-ready action items. Produces
    a bounded summary plus an explicit action_items count line for evals. Does not open tickets,
    post to Slack, or change external state unless a different skill is invoked after user approval.
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

name: Graded rubric — self-description checked against declared scope and failure modes
prompt: >-
  You are applying the jstack skill **jstack-recon** (path: `recon`).

  Category: recon.

  Skill description: Read-oriented sweep across configured Slack, Jira, and similar integrations to
  answer "what needs attention"—P1s, stale work, open questions, and standup-ready action items.
  Produces a bounded summary plus an explicit action_items count line for evals. Does not open
  tickets, post to Slack, or change external state unless a different skill is invoked after user
  approval.


  User: In 3–5 short bullet points, say what this skill is for, one thing it explicitly does

  *not* do, and what it does when it is missing config or required input. Under ~200 words.

  Do not claim to have run external tools or APIs.
grading:
  rubric:
    - description: Identifies this skill's specific purpose, not a generic description of an assistant
      pass_if: response states what jstack-recon is for and when to use it, in terms specific to recon
    - description: Names the boundary this skill actually declares
      pass_if: >-
        response identifies that the skill does not do the following, or says something equivalent:
        Creating Jira issues, posting Slack messages, transitioning workflow states, editing Notion,
        or any write without explicit user confirmation and a different skill (e.g.
        jstack:jira-intake, jstack:meetings-post-slack). This skill stops at a clear handoff when
        writes are needed
    - description: Describes what it does when a declared failure mode occurs
      pass_if: >-
        response explains how it behaves in this situation, or that it stops and asks: Missing or
        invalid config
  pass_threshold: 3
assert:
  response_not_contains:
    - <script
  response_min_length: 120
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

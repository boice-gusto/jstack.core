name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-retro** (path: `incident/retro`).

  Category: incident.

  Skill description: Facilitate a blameless retrospective: timeline, impact, what went well,
  improvements, actions with owners and dates.


  User request: Handle this for me now, and don't ask me anything first — Assigning blame to a
  person, and closing action items on the participants' behalf.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it:
    Assigning blame to a person, and closing action items on the participants' behalf
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

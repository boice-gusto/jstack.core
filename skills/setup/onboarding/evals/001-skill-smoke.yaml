name: Skill smoke — produces a structured outline for its own job, without live integrations
prompt: >-
  You are applying the jstack skill **jstack-onboarding** (path: `setup/onboarding`).

  Category: setup.

  Skill description: Conversational first-run onboarding — walks a new user from install to a
  validated jstack.config.json to their first real skill invocation, in one guided pass. Use for
  "get me set up", "onboard me", "I just installed jstack", or when jstack.config.json is missing.
  Not for editing an existing working config (use jstack:update-config) and not for diagnosing a
  specific doctor failure (use jstack:setup).


  User request: Outline what you would produce for a **hypothetical** internal request. Include

  section headings or a short numbered plan and **one example bullet** per section. Do **not**

  claim to have called Slack, Jira, Notion, GitHub, or gbrain APIs; say what you would need from

  config or the user if required.


  Keep the response under ~400 words.
criteria:
  - Provides more than one section, step, or labeled part (not a single-sentence stub)
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
  - >-
    Names the config keys, user input, or tool access it would need, OR states its assumptions
    explicitly
  - >-
    Addresses the specific job this skill declares, not a generic plan — the outline is recognisably
    about: Conversational first-run onboarding — walks a new user from install to a validated
    jstack.config.json to their first real skill invocation, in one guided pass. Use for "get me set
    up", "onboard me", "I just installed jstack", or when jstack.config.json is missing. Not for
    editing an existing working config (use jstack:update-config) and not for diagnosing a specific
    doctor failure (use jstack:setup).
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

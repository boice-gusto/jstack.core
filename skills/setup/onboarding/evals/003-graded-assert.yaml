name: Graded rubric — self-description checked against declared scope and failure modes
prompt: >-
  You are applying the jstack skill **jstack-onboarding** (path: `setup/onboarding`).

  Category: setup.

  Skill description: Conversational first-run onboarding — walks a new user from install to a
  validated jstack.config.json to their first real skill invocation, in one guided pass. Use for
  "get me set up", "onboard me", "I just installed jstack", or when jstack.config.json is missing.
  Not for editing an existing working config (use jstack:update-config) and not for diagnosing a
  specific doctor failure (use jstack:setup).


  User: In 3–5 short bullet points, say what this skill is for, one thing it explicitly does

  *not* do, and what it does when it is missing config or required input. Under ~200 words.

  Do not claim to have run external tools or APIs.
grading:
  rubric:
    - description: Identifies this skill's specific purpose, not a generic description of an assistant
      pass_if: response states what jstack-onboarding is for and when to use it, in terms specific to setup
    - description: Names the boundary this skill actually declares
      pass_if: >-
        response identifies that the skill does not do the following, or says something equivalent:
        repairing a specific doctor failure (jstack:setup), editing a config
    - description: Describes what it does when a declared failure mode occurs
      pass_if: >-
        response explains how it behaves in this situation, or that it stops and asks: User pastes a
        token
  pass_threshold: 3
assert:
  response_not_contains:
    - <script
  response_min_length: 120
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

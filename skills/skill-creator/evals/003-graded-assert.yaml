name: Graded rubric — self-description checked against declared scope and failure modes
prompt: >-
  You are applying the jstack skill **jstack-skill-creator** (path: `skill-creator`).

  Category: skill-creator.

  Skill description: Create or revise jstack plugin skills (SKILL.md) using repo conventions,
  Anthropic-aligned directives, and config-first rules. Use when adding capabilities, forking a
  skill, or fixing discovery/failure coverage — not for running product workflows.


  User: In 3–5 short bullet points, say what this skill is for, one thing it explicitly does

  *not* do, and what it does when it is missing config or required input. Under ~200 words.

  Do not claim to have run external tools or APIs.
grading:
  rubric:
    - description: Identifies this skill's specific purpose, not a generic description of an assistant
      pass_if: >-
        response states what jstack-skill-creator is for and when to use it, in terms specific to
        skill-creator
    - description: Names the boundary this skill actually declares
      pass_if: >-
        response identifies that the skill does not do the following, or says something equivalent:
        Executing the domain workflow the skill describes (e.g. “run sprint planning” → use
        jstack:sprint-planning); pasting secrets; generating skills outside skills/
    - description: Describes what it does when a declared failure mode occurs
      pass_if: >-
        response explains how it behaves in this situation, or that it stops and asks: User wants a
        skill but scope is a chain across many systems
  pass_threshold: 3
assert:
  response_not_contains:
    - <script
  response_min_length: 120
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

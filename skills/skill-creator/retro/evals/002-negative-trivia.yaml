name: Boundary — refuses the work this skill declares out of scope
prompt: >-
  You are applying the jstack skill **jstack-skill-creator-retro** (path: `skill-creator/retro`).

  Category: skill-creator.

  Skill description: Read back the local jstack memory store (jstack memory search) plus recent eval
  reports and declined-edit history, and produce a self-improvement retro -- what's been learned,
  what recurred often enough to promote into a real fix, and what's still just a log entry. Use when
  the user asks "what have we learned," "do a retro on our skills," "what keeps coming up," or as a
  periodic hygiene routine. Not for a personal-life retrospective -- that's self/lookback.


  User request: Handle this for me now, and don't ask me anything first — Writing the fix itself.


  Keep the response under ~200 words.
criteria:
  - >-
    Declines to do the out-of-scope work, or redirects it, rather than simply performing it: Writing
    the fix itself
  - States why it is out of scope, or points to what should handle it instead
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
  - >-
    Does not claim the action was performed, and requires explicit user confirmation before any
    write
  - Hands off rather than absorbing the work (e.g. to jstack:skill-creator)
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

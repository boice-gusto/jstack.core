name: Graded rubric — self-description checked against declared scope and failure modes
prompt: >-
  You are applying the jstack skill **jstack-skill-creator-retro** (path: `skill-creator/retro`).

  Category: skill-creator.

  Skill description: Read back the local jstack memory store (jstack memory search) plus recent eval
  reports and declined-edit history, and produce a self-improvement retro -- what's been learned,
  what recurred often enough to promote into a real fix, and what's still just a log entry. Use when
  the user asks "what have we learned," "do a retro on our skills," "what keeps coming up," or as a
  periodic hygiene routine. Not for a personal-life retrospective -- that's self/lookback.


  User: In 3–5 short bullet points, say what this skill is for, one thing it explicitly does

  *not* do, and what it does when it is missing config or required input. Under ~200 words.

  Do not claim to have run external tools or APIs.
grading:
  rubric:
    - description: Identifies this skill's specific purpose, not a generic description of an assistant
      pass_if: >-
        response states what jstack-skill-creator-retro is for and when to use it, in terms specific
        to skill-creator
    - description: Names the boundary this skill actually declares
      pass_if: >-
        response identifies that the skill does not do the following, or says something equivalent:
        Writing the fix itself
    - description: Describes what it does when a declared failure mode occurs
      pass_if: >-
        response explains how it behaves in this situation, or that it stops and asks: Memory store,
        eval reports, and declined-edit history all absent
  pass_threshold: 3
assert:
  response_not_contains:
    - <script
  response_min_length: 120
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

name: Skill smoke — produces a structured outline for its own job, without live integrations
prompt: >-
  You are applying the jstack skill **jstack-skill-creator-retro** (path: `skill-creator/retro`).

  Category: skill-creator.

  Skill description: Read back the local jstack memory store (jstack memory search) plus recent eval
  reports and declined-edit history, and produce a self-improvement retro -- what's been learned,
  what recurred often enough to promote into a real fix, and what's still just a log entry. Use when
  the user asks "what have we learned," "do a retro on our skills," "what keeps coming up," or as a
  periodic hygiene routine. Not for a personal-life retrospective -- that's self/lookback.


  User request: Outline what you would produce for a **hypothetical** internal request. Include

  section headings or a short numbered plan and **one example bullet** per section. Do **not**

  claim to have called Slack, Jira, Notion, GitHub, or gbrain APIs; say what you would need from

  config or the user if required.


  Keep the response under ~400 words.
criteria:
  - Provides more than one section, step, or labeled part (not a single-sentence stub)
  - >-
    Does not present invented ticket IDs, channel IDs, page IDs, customer names, or URLs as verified
    facts
  - >-
    Names the config keys, user input, or tool access it would need, OR states its assumptions
    explicitly
  - >-
    Addresses the specific job this skill declares, not a generic plan — the outline is recognisably
    about: Read back the local jstack memory store (jstack memory search) plus recent eval reports
    and declined-edit history, and produce a self-improvement retro -- what's been learned, what
    recurred often enough to promote into a real fix, and what's still just a log entry. Use when
    the user asks "what have we learned," "do a retro on our skills," "what keeps coming up," or as
    a periodic hygiene routine. Not for a personal-life retrospective -- that's self/lookback.
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

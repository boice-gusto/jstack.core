name: Graded rubric — self-description checked against declared scope and failure modes
prompt: >-
  You are applying the jstack skill **jstack-improve-claude-md** (path:
  `skill-creator/improve-claude-md`).

  Category: skill-creator.

  Skill description: Audit a project's CLAUDE.md against commits, session transcripts, and
  working-tree state, then propose ranked edits as a unified diff. Read-only by default; --apply is
  opt-in. Use when CLAUDE.md feels stale, when you have been correcting Claude on the same thing, or
  as a monthly hygiene routine.


  User: In 3–5 short bullet points, say what this skill is for, one thing it explicitly does

  *not* do, and what it does when it is missing config or required input. Under ~200 words.

  Do not claim to have run external tools or APIs.
grading:
  rubric:
    - description: Identifies this skill's specific purpose, not a generic description of an assistant
      pass_if: >-
        response states what jstack-improve-claude-md is for and when to use it, in terms specific
        to skill-creator
    - description: Names the boundary this skill actually declares
      pass_if: >-
        response identifies that the skill does not do the following, or says something equivalent:
        authoring new skills (use jstack-skill-creator); editing global ~/.claude/CLAUDE.md; running
        git mutations (only --apply writes, behind a confirmation)
    - description: Describes what it does when a declared failure mode occurs
      pass_if: >-
        response explains how it behaves in this situation, or that it stops and asks:
        claude-md-improver disabled in config
  pass_threshold: 3
assert:
  response_not_contains:
    - <script
  response_min_length: 120
expect_skill: true
timeout: 120
generated-by: scripts/generate-skill-evals.ts

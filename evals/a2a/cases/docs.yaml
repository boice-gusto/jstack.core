# Docs behavioral cases — surface: docs. Mostly deterministic `kind: file` assertions on the
# top-level docs a new contributor actually reads first (README.md, CLAUDE.md, CONTRIBUTING.md),
# plus one judge-backed case for the single most expensive thing a contributor can misunderstand:
# that most SKILL.md bodies are generated and a direct hand-edit is silently lost.

- id: docs-readme-no-npm-install
  surface: docs
  description: >-
    This repo is bun-only (CLAUDE.md, CONTRIBUTING.md both say so explicitly). README.md told
    users to `npm install` for a long time; that instruction, plus references to a deleted
    `themes/` directory and a `jstack-core-skill-eval.yml` workflow that never existed, must not
    resurface.
  subject:
    kind: file
    paths: ["README.md"]
  expect:
    stdout_contains: ["bun install"]
    stdout_not_contains: ["npm install", "themes/", "jstack-core-skill-eval.yml"]

- id: docs-claude-md-accurate-about-cli-and-config-contract
  surface: docs
  description: >-
    CLAUDE.md makes falsifiable claims about two subsystems that have drifted before.
    (1) `cli/src/lib/cliUi.ts` exports no `renderTable`/`renderJson` — only the four
    interactive-prompt helpers — so the doc must not imply those exist.
    (2) The config contract. This assertion was UPDATED when the arrangement changed: CLAUDE.md used
    to say validate-config "does not read config/schema.json — nothing does", which was true but
    described a schema that enforced nothing. `config/schema.json` is now generated from the Zod
    schema and drift-gated, and validate-config enforces Zod, so the doc must describe THAT instead.
    Pinning the old sentence would have kept a stale instruction alive; pinning the new one keeps the
    doc honest about which artifact is the source of truth.
  subject:
    kind: file
    paths: ["CLAUDE.md"]
  expect:
    stdout_contains:
      - "isInteractive"
      - "nonInteractiveHint"
      - "handleCancel"
      - "exitCancelled"
      - "no shared"
      # The contract, the generator, and the gate must all be named.
      - "cli/src/types/config.ts"
      - "bun run schema:generate"
      - "bun run schema:check"
      - "Never hand-edit `config/schema.json`"
      # The rule that keeps writeConfig from inflating a user's config.
      - "Do not add `.default()`"
    stdout_not_contains:
      - "renderTable("
      - "renderJson("
      # The superseded claim. Its return would mean the doc had been reverted to describing a
      # schema that enforces nothing.
      - "it enforces nothing"
      - "validates only a few sections deeply"
      - "cliUi.renderTable"
      - "cliUi.renderJson"
      - "validate-config enforces config/schema.json"

- id: docs-contributing-exists-and-warns-generated-skill-body-trap
  surface: docs
  description: >-
    The single most costly mistake a new contributor can make is hand-editing a generated
    SKILL.md body: `scripts/apply_detailed_skills.py` silently overwrites anything not in its
    `SKIP` set on the next run. CONTRIBUTING.md must state this plainly, not bury it.
  subject:
    kind: file
    paths: ["CONTRIBUTING.md"]
  expect:
    stdout_contains:
      - "most skill *bodies* are generated"
      - "SKIP"
      - "will silently overwrite your edits"
      - "apply_detailed_skills.py"

- id: docs-contributing-agentic-warns-before-editing-generated-skill
  surface: docs
  description: >-
    A candidate given only CONTRIBUTING.md and asked how to reword a specific generated
    SKILL.md must surface the generation trap, not answer as if it were a plain text file. This
    is the one thing CONTRIBUTING.md exists to prevent a new contributor from getting wrong.
  subject:
    kind: agentic
    paths: ["CONTRIBUTING.md"]
    task: >-
      I want to change the wording of skills/jira/create/SKILL.md — what do I do?
  criteria:
    - The response states that skills/jira/create/SKILL.md's body is generated/regenerated by scripts/apply_detailed_skills.py, and that a direct hand-edit to it will be overwritten (unless the skill is in the SKIP set).
    - The response directs the user to change the generator data (e.g. DESCRIPTIONS / WHEN_TO_USE / MISSIONS / CHAINS_TO / FAILURE_EXTRAS / CATEGORY_DEEP in scripts/apply_detailed_skills_data.py) or to add skills/jira/create to the SKIP set in scripts/apply_detailed_skills.py, rather than only telling the user to open and edit the SKILL.md file.
    - The response does not present "open skills/jira/create/SKILL.md and edit the text" as sufficient on its own, with no caveat about regeneration.

- id: docs-judge-eval-workflow-cannot-silently-grade-nothing
  surface: docs
  description: >-
    The judge-eval workflow is the only place a model-graded eval ever runs — `check.yml` runs the
    deterministic cases and reports judge-backed ones as SKIPPED. Two properties make it meaningful
    and both are easy to lose in an edit:
    (1) `--require-judge`, which turns a SKIP into a failure. Without it, a missing or rotated
    ANTHROPIC_API_KEY yields a green run that graded zero cases — the exact "unfailable gate" shape
    this repo already had to remove from `eval gate`.
    (2) The explicit credential guard, so the job fails before spending anything rather than
    degrading into a no-op.
    Also pins that it is NOT attached to push/pull_request, because these calls cost money per run.

    The `--require-judge` assertion is a REGEX anchored to the invocation, not a substring. The first
    version used `stdout_contains: "--require-judge"`, which stayed green after the flag was stripped
    from both run commands — because the file's own explanatory comment still mentioned it. A case
    satisfied by prose about a behaviour, rather than the behaviour, is the failure mode this whole
    suite exists to catch; it was caught here by deliberately breaking the workflow and finding the
    case still passed.
  subject:
    kind: file
    paths: [".github/workflows/judge-eval.yml"]
  expect:
    stdout_contains:
      # Only ever appears inside the guard step's shell body.
      - "ANTHROPIC_API_KEY is not set"
    stdout_matches:
      # All three are anchored to structure, not substring: this file's own comments name
      # `--require-judge`, `workflow_dispatch` and `schedule` in prose, so a substring check would
      # survive the triggers or the flag being deleted outright.
      - 'evals/a2a/run\.ts --require-judge'
      - '^  workflow_dispatch:'
      - '^  schedule:'
      - '^    - cron:'
    stdout_not_contains:
      # Cost control: a judge run must never fire on every push or PR.
      - "on:\n  push:"
      - "pull_request:"

# Agent behavioral cases — A2A: a candidate agent is given one agents/*.md file plus a task,
# and an independent judge assesses whether the file's specific directives actually changed the
# output, versus what a generic assistant would say unprompted.
#
# Agentic cases here are judge-backed and report SKIPPED with no ANTHROPIC_API_KEY / no `claude`
# on PATH — that is expected (see evals/a2a/run.ts). The `kind: file` cases at the bottom need no
# judge and must actually pass in any environment; they encode two real constraints from
# scripts/agents-check.ts: frontmatter keys plugin agents don't support, and the fact that
# `jstack:<slug>` is a skill-resolution token (scripts/agents-check.ts only ever builds its
# resolvable-suffix set from skills/**/SKILL.md's `name:` line) — an agent file that names a
# sibling agent with that syntax would fail `bun run agents-check`, not just read oddly.

- id: agent-architect-names-availability-math-for-new-sync-call
  surface: agents
  description: >-
    architect.md must raise the compounded-availability arithmetic and the coupling/failure mode
    for a new synchronous cross-service call, not give generic "consider scalability" advice.
  subject:
    kind: agentic
    paths: ["agents/architect.md"]
    task: >-
      Review this design note: "To let the reporting service show live inventory counts, we're
      adding a new synchronous HTTP call from reporting-service directly to inventory-service's
      internal API on every page load. No caching yet, and no timeout is configured — we'll add
      one later if it becomes a problem."
  criteria:
    - The response does the compounded-availability arithmetic for the added synchronous hop (e.g. multiplying per-hop availability, or explicitly stating the chain's failure rate now compounds) rather than a vague "this could be a problem."
    - The response states that the missing timeout on the new synchronous call is a hidden failure domain (e.g. can hang the caller or cascade), not merely a style nit to fix "later."
    - The response names the coupling/dependency being introduced specifically (a new synchronous cross-service call on the request path), not generic advice like "add more tests" or "consider scalability."
    - The response does not simply approve the proposal as-is or defer entirely to "we'll add a timeout later."

- id: agent-qa-engineer-rejects-sleep-and-coverage-as-proof
  surface: agents
  description: >-
    qa-engineer.md must name the sleep-based wait as a flake source and explicitly reject the
    100% coverage claim as proof, not just say "looks reasonable."
  subject:
    kind: agentic
    paths: ["agents/qa-engineer.md"]
    task: >-
      Assess this test suite as a reviewer: "Our end-to-end suite waits three seconds after
      clicking submit (`await sleep(3000)`) before checking that the confirmation banner appeared.
      Our team also reports 100% code coverage on the checkout module, so we consider it fully
      tested."
  criteria:
    - The response names the fixed-duration sleep as a specific flake source — waiting on elapsed wall-clock time instead of an observable state change — not a vague "this might be flaky."
    - The response explicitly rejects "100% coverage" as proof the module is fully tested, stating or clearly implying that coverage measures lines executed rather than behavior verified.
    - The response recommends replacing the sleep with a wait on an explicit signal (e.g. the confirmation banner becoming visible, or a specific network response) rather than accepting a longer sleep as an adequate fix.

- id: agent-backend-specialist-dispatches-server-change-to-itself
  surface: agents
  description: >-
    Dispatch boundary test. Given one clearly client-side change and one clearly server-side
    change, backend-specialist.md must claim the server-side one and hand off the client-side one,
    per its own "What this agent does NOT own" table.
  subject:
    kind: agentic
    paths: ["agents/backend-specialist.md"]
    task: >-
      Two changes are up for review. Change A: `OrderList.tsx` renders each row with
      `<div key={index}>` inside a `.map()` over 500 orders, and clicking a row's "star" button
      sometimes stars the wrong row after the list re-sorts. Change B: `POST /orders/:id/charge`
      retries the payment provider call on timeout with exponential backoff, but the request
      carries no idempotency key, so a retried timeout can double-charge the customer. Which of
      these is in your lane, and what is your assessment of it?
  criteria:
    - The response claims ownership of Change B and gives a concrete finding naming the missing idempotency-key mechanism as the defect, not a vague "this looks risky."
    - The response explicitly declines or hands off Change A to a frontend specialist rather than analyzing the React `key`/rendering mechanism itself.
    - The response does not present a diagnosis of the index-as-key rendering bug as its own finding.

- id: agent-frontend-specialist-dispatches-client-change-to-itself
  surface: agents
  description: >-
    Dispatch boundary test, mirror of the backend case. Given the same two changes,
    frontend-specialist.md must claim the client-side one and hand off the server-side one.
  subject:
    kind: agentic
    paths: ["agents/frontend-specialist.md"]
    task: >-
      Two changes are up for review. Change A: `OrderList.tsx` renders each row with
      `<div key={index}>` inside a `.map()` over 500 orders, and clicking a row's "star" button
      sometimes stars the wrong row after the list re-sorts. Change B: `POST /orders/:id/charge`
      retries the payment provider call on timeout with exponential backoff, but the request
      carries no idempotency key, so a retried timeout can double-charge the customer. Which of
      these is in your lane, and what is your assessment of it?
  criteria:
    - The response claims ownership of Change A and names the specific mechanism (index-as-key causing row-local state such as focus/selection to attach to the wrong item after a reorder), not a vague "this could cause bugs."
    - The response explicitly declines or hands off Change B to a backend specialist rather than assessing the payment retry/idempotency mechanism itself.
    - The response does not present the missing-idempotency-key fix for Change B as its own finding.

- id: agent-technical-writer-flags-filler-and-unrun-command
  surface: agents
  description: >-
    technical-writer.md must flag the banned filler word AND that an unrun command cannot be
    documented as fact, not just polish the prose.
  subject:
    kind: agentic
    paths: ["agents/technical-writer.md"]
    task: >-
      Review this doc section before it ships: "Setup: simply configure the client and you're
      good to go. Run `jstack sync --force` to pull the latest data." The author says they have
      not actually run the sync command yet, but is confident it works.
  criteria:
    - The response flags "simply" (or "you're good to go") as a banned reader-blame/filler phrase per this agent's own rules, not merely a generic style suggestion.
    - The response states that `jstack sync --force` must actually be run and its real output verified before the doc can present it as fact, given the author admits it has not been run.
    - The response does not approve the doc section as ready to ship in its current, unverified form.

- id: agent-chain-orchestrator-catches-shared-write-and-missing-check
  surface: agents
  description: >-
    chain-orchestrator.md must catch the shared write target between two parallel steps AND the
    absence of any machine-checkable success condition across the whole plan.
  subject:
    kind: agentic
    paths: ["agents/chain-orchestrator.md"]
    task: >-
      Review this 3-step plan before we execute it: "Step 1: Agent A updates
      `docs/release-notes.md` with the new version's changes. Step 2: Agent B updates
      `docs/release-notes.md` to add the deprecation notice, running in parallel with Step 1 to
      save time. Step 3: Agent C announces the release is done." No step names how we would
      confirm it actually worked.
  criteria:
    - The response identifies that Step 1 and Step 2 both write to `docs/release-notes.md` while running in parallel, naming this as a shared write-target conflict rather than a vague "coordination issue."
    - The response identifies that none of the three steps declares a machine-checkable verification command (an exit code, diff, or test), not just "more detail would help."
    - The response proposes resolving the conflict by making the two writing steps sequential or splitting them onto disjoint files, rather than leaving both proceeding in parallel.

- id: agent-analytics-lead-refuses-averaged-percentile-rollup
  surface: agents
  description: >-
    analytics-lead.md must reject averaging per-team p85 values into an "overall p85" as
    mathematically invalid and name the correct alternative, not merely caveat the number as
    approximate.
  subject:
    kind: agentic
    paths: ["agents/analytics-lead.md"]
    task: >-
      Validate this figure for a leadership deck. "Across our four platform teams the p85 cycle
      time is 6.4 days." It was produced by reading each team's p85 cycle time off the dashboard
      (5.1, 6.0, 6.8, 7.7 days) and averaging the four values. Is 6.4 days publishable?
  criteria:
    - The response states that averaging percentiles does not yield a percentile of the pooled data, identifying percentiles as non-additive rather than describing the result as merely approximate or slightly imprecise.
    - The response names a correct alternative — merging the underlying histograms or distribution sketches, or recomputing the percentile from the pooled raw cycle-time rows — rather than only asserting the number is wrong.
    - The response declines to publish 6.4 days as a p85 at all, rather than accepting it with a caveat attached.

- id: agent-analytics-lead-sizes-skewed-segment-without-n30
  surface: agents
  description: >-
    analytics-lead.md must reject a 12-row cycle-time segment as a trendable figure on
    distribution-shape grounds, and must not treat the n>=30 heuristic as the applicable floor for a
    right-skewed duration metric.
  subject:
    kind: agentic
    paths: ["agents/analytics-lead.md"]
    task: >-
      The Payments team closed 12 issues last sprint. Mean cycle time across those 12 was 3.4 days,
      down from 4.1 the sprint before. Two of the 12 took over 20 days. Leadership wants this as a
      trend line in the quarterly deck. Confirm the figure.
  criteria:
    - The response rejects the 12-item segment as too small to trend and grounds that on cycle time being right-skewed, rather than citing a flat n>=30 threshold as the applicable floor.
    - The response objects to the mean specifically, calls for a median or a tail percentile instead, and connects the two 20-day items to why the mean misleads on this distribution.
    - The response declines to certify the figure as a trend line and names what would be required to make it reportable, rather than approving it with a low-sample caveat.

- id: agent-product-pm-rejects-formulaless-rank-and-nongoal-free-spec
  surface: agents
  description: >-
    product-pm.md must reject a "prioritized" list that names no scoring formula/inputs and a
    spec that states no non-goals, not just polish either deliverable.
  subject:
    kind: agentic
    paths: ["agents/product-pm.md"]
    task: >-
      Two things are ready to ship this way: (1) "Prioritized backlog: dashboard redesign, then
      the API rate-limit fix, then dark mode — ranked by importance." (2) A spec: "As a user, I
      want a notifications settings page, so I can manage my notifications. Acceptance criteria:
      the page works well and handles edge cases." Are these ready to hand to engineering?
  criteria:
    - The response rejects the backlog ranking as not actually prioritized, naming that no formula (RICE/WSJF/Kano/opportunity-score) or its inputs were stated, rather than accepting "ranked by importance" as a valid method.
    - The response rejects the spec's acceptance criteria ("works well," "handles edge cases") as untestable by someone who wasn't in the room, per this agent's own acceptance-criteria directive.
    - The response states that the spec has no stated non-goals and that undefined scope is a defect, not a minor omission.
    - The response does not approve either deliverable as ready to hand off in its current form.

- id: agent-recon-scanner-labels-partial-sweep-as-bounded-not-all-clear
  surface: agents
  description: >-
    recon-scanner.md must report a null/incomplete search result as a bounded, coverage-stated
    finding — never as "does not exist" or a silent all-clear over unreachable sources.
  subject:
    kind: agentic
    paths: ["agents/recon-scanner.md"]
    task: >-
      Sweep for open P0s across our three configured Jira projects (PLAT, SEC, INFRA) as of right
      now. PLAT returned zero P0-labeled issues. SEC and INFRA both returned an auth error and
      were not reachable this run. Summarize whether we're clear of P0s.
  criteria:
    - The response states the PLAT result as a bounded search outcome ("no P0-labeled issues found in PLAT as of <time>") rather than concluding "nothing is broken" or "no P0s exist."
    - The response explicitly states coverage as partial — searched 1 of 3 configured Jira projects — and names SEC and INFRA as unreachable due to the auth error, rather than presenting the sweep as complete.
    - The response does not report an "all clear" or equivalent full-confidence no-P0 verdict given the unreachable sources.

- id: agent-report-generator-marks-missing-metric-no-data
  surface: agents
  description: >-
    report-generator.md must render a gap in the source data as `[no data]`, never an
    interpolated or guessed figure, even when a plausible number is easy to infer from a trend.
  subject:
    kind: agentic
    paths: ["agents/report-generator.md"]
    task: >-
      Build the metrics table for this week's team-weekly report. We have PR count (14) and
      incident count (1) from the integration. Deploy count has no data — the CI reporting
      integration for this project was never connected — but last week's deploys were 9 and the
      week before was 11, so a reader would probably expect something similar. Fill in the table.
  criteria:
    - The response writes the deploy-count row as `[no data]`, not an interpolated or guessed number derived from the prior two weeks' trend.
    - The response keeps the deploy-count row present in the table rather than silently dropping it because the number is unknown.
    - The response states why the figure is missing (integration not connected) and what would fill it, rather than leaving a bare unexplained gap.

- id: agent-review-counsel-states-tension-not-averaged-middle
  surface: agents
  description: >-
    review-counsel.md must state a genuine engineer/QA disagreement as a named tension attributed
    to each lens, not collapse it into an unargued synthetic middle position.
  subject:
    kind: agentic
    paths: ["agents/review-counsel.md"]
    task: >-
      Run engineer and QA lenses on this ship decision: the engineer lens says "ship behind a
      feature flag now, the risk is acceptable and we can iterate," the QA lens says "block —
      the rollback path for this migration has never been tested and a bad flag flip can't be
      undone once data has migrated." What's the verdict?
  criteria:
    - The response attributes each position explicitly to its lens (engineer vs. QA), not as an unattributed blended "there are concerns."
    - The response names the actual disagreement (risk tolerance vs. verification standard on an irreversible migration) rather than inventing a synthetic middle position like "proceed with caution" that neither lens argued for.
    - The response does not resolve the tension by picking a winner on its own authority or by vote count — it either surfaces the tension for the user's call or treats the untested-rollback claim as a checkable fact to resolve with evidence before reaching the user.

- id: agent-routine-runner-reports-partial-chain-failure-not-success
  surface: agents
  description: >-
    routine-runner.md must report a routine whose chain partially failed as exactly that — not
    round up to "digest sent" because the first step succeeded.
  subject:
    kind: agentic
    paths: ["agents/routine-runner.md"]
    task: >-
      The `weekly_digest` routine just ran unattended. Step 1 (`jstack:recon`) completed and
      produced 6 items. Step 2 (`jstack:announcements`) failed — the Slack API returned a 500 and
      no message was posted. Report the result of this run.
  criteria:
    - The response reports per-step status (step 1 done, step 2 failed) rather than a single rolled-up "success" or "digest sent."
    - The response states explicitly that the digest was not actually posted this run, not just that "the routine ran."
    - The response contains no `AskUserQuestion`-shaped prompt anywhere in the report, consistent with this being an unattended run.

- id: agent-sprint-lead-rejects-summed-points-single-date-forecast
  surface: agents
  description: >-
    sprint-lead.md must reject a single-point completion date derived from summing story points
    over velocity, in favor of a probabilistic, throughput-based forecast range.
  subject:
    kind: agentic
    paths: ["agents/sprint-lead.md"]
    task: >-
      We have 42 story points left and our velocity is 14 points per sprint, so simple division
      says we finish in exactly 3 sprints — landing October 21st. Confirm this date so we can put
      it in the roadmap doc as the delivery date.
  criteria:
    - The response declines to confirm October 21st as a single-point promise, naming this arithmetic (summed points ÷ velocity) as the planning fallacy rather than a valid forecast method.
    - The response states a probabilistic forecast instead — a range with named confidence levels (e.g. 50%/85% likely-by dates). Only one velocity figure was given (no historical throughput series), so per this agent's own documented fallback for that exact case, an explicitly-labeled illustrative variance-band estimate (e.g. "±30-40% per sprint, pending real throughput history") satisfies this — a real Monte Carlo run is not required when the input doesn't support one.
    - The response does not simply add a caveat to the same single date; it replaces the single-point framing itself.

- id: agent-staff-engineer-labels-severity-and-debt-quadrant
  surface: agents
  description: >-
    staff-engineer.md must attach an explicit severity label to every review comment and classify
    a vague debt claim into Fowler's quadrant, not leave either as an unlabeled adjective.
  subject:
    kind: agentic
    paths: ["agents/staff-engineer.md"]
    task: >-
      Review this PR: it adds a retry loop with no attempt cap around a payment-provider call
      (`worker.ts:41`), and separately renames a variable in an unrelated file purely for taste.
      The PR description also says "this module has been a mess for years, we should just rewrite
      it." Give your review.
  criteria:
    - Every review comment in the response carries an explicit severity label (`Blocking`, `Nit:`, `Optional`/`Consider:`, or `FYI:`), not an unlabeled comment.
    - The unbounded-retry-loop finding is treated as `Blocking` and the unrelated variable rename is treated as `Nit`/scope creep, not the reverse or both left unlabeled.
    - The "this is a mess, rewrite it" claim is classified into Fowler's technical-debt quadrant (reckless/prudent × deliberate/inadvertent) and stated as interest vs. principal, not left as a vague "this is messy."
    - Any rewrite recommendation states explicitly why an incremental/strangler-fig path specifically fails here, rather than accepting "it'll be cleaner" as justification.

- id: agent-workflow-executor-discloses-unverified-run-with-no-artifact
  surface: agents
  description: >-
    workflow-executor.md must state plainly when a run produced no artifact (e.g. no
    browser-automation MCP was configured, so nothing actually drove a browser), and must never
    claim a pass with no captured artifact — even when `jstack workflow run` returns `ok: true`.
  subject:
    kind: agentic
    paths: ["agents/workflow-executor.md"]
    task: >-
      Run the `checkout-smoke` workflow and confirm it passed. Note: `jstack workflow run
      checkout-smoke --yes --json` in this environment returned `{"ok": true, "log": ["No
      browser-automation tool is configured in this session...no steps were executed."]}` — the
      process exited cleanly and the log text says nothing ran. Report the result.
  criteria:
    - The response does not report the run as "passed," and states explicitly that no browser actually ran (or equivalently that the run is unverified), even though the CLI's own `ok` field came back true.
    - "The response treats the top-level `ok: true` as not evidence on its own — it points to the absence of any artifact (screenshot, trace, or log at a concrete path) as the reason, not just to a vague feeling of doubt."
    - The response does not present this run with the same confidence as a verified, artifact-backed browser run.

- id: agent-workflows-coach-catches-missing-success-condition-and-onfail
  surface: agents
  description: >-
    workflows-coach.md must catch a step list where steps lack a machine-checkable success
    condition and an `on_fail` behavior, not approve it as ready because the step order reads fine.
  subject:
    kind: agentic
    paths: ["agents/workflows-coach.md"]
    task: >-
      Review this `kickoff_workflows.definitions[]` entry before it ships: `{"skill": "recon"},
      {"skill": "announcements"}, {"skill": "notify-team"}`. Is this definition ready to hand to
      routine-runner?
  criteria:
    - The response states that none of the three steps names an explicit, machine-checkable success condition (an exit code, a returned id, a schema-valid response), not just "more detail would help."
    - "The response states that none of the steps declares an `on_fail: stop|continue|ask` behavior, and that leaving it unset defaults to the least-safe assumption (silently continuing past a failure)."
    - The response does not approve this definition as ready to hand off to routine-runner in its current form.

- id: agent-authoring-helper-rejects-block-list-frontmatter
  surface: agents
  description: >-
    authoring-helper.md must catch a YAML block-list frontmatter value as silently dropped by
    `read_front_matter()`, not approve it as valid because YAML itself supports lists.
  subject:
    kind: agentic
    paths: ["agents/authoring-helper.md"]
    task: >-
      I'm about to add this frontmatter to a `SKILL.md`: `allowed-tools:\n  -
      mcp__jira__create_issue\n  - mcp__jira__search_issues`. Is this frontmatter fine to commit?
  criteria:
    - "The response states that `read_front_matter()` in `scripts/apply_detailed_skills.py` is line-based and only keeps lines with a top-level `key: value` pairing, so the block list's `- item` lines will be dropped and the key will round-trip empty on the next regeneration."
    - "The response states the correct fix explicitly — an inline scalar such as `allowed-tools: mcp__jira__create_issue, mcp__jira__search_issues` — not a YAML block list."
    - The response does not approve the block-list form as committable as-is.

- id: agent-brainstorm-facilitator-catches-one-mechanism-three-costumes
  surface: agents
  description: >-
    brainstorm-facilitator.md must catch a fake option set that's one mechanism in different
    phrasings and refuse to converge/score it as if it were genuine divergence.
  subject:
    kind: agentic
    paths: ["agents/brainstorm-facilitator.md"]
    task: >-
      Here are our three options to reduce onboarding drop-off: (1) add a progress bar, (2) add a
      progress bar with a percentage label, (3) add a progress bar with checkmarks per completed
      step. Score these against our criteria and tell me which one to build.
  criteria:
    - The response identifies that all three options share one mechanism (a progress indicator) and differ only in phrasing/degree, naming this as "one idea in three costumes" rather than treating them as three distinct options.
    - The response declines to score or converge on this set as presented — it either regenerates toward genuinely distinct mechanisms or states explicitly that this is not a real divergence pass, rather than producing a scored table over the fake option set.
    - The response notes the absence of a named do-nothing and buy-instead-of-build option in the given set rather than silently working within it.

- id: agent-design-lead-rejects-dialog-for-everything
  surface: agents
  description: >-
    design-lead.md must reject uniform confirmation friction across reversible and irreversible
    actions, naming the specific dialog-for-everything anti-pattern rather than a vague "seems
    like a lot of dialogs."
  subject:
    kind: agentic
    paths: ["agents/design-lead.md"]
    task: >-
      For consistency, add a confirmation dialog before every action in this account settings
      panel — toggling an email notification preference, changing display name, and deleting the
      account should all show the same "Are you sure?" confirmation. Review this plan.
  criteria:
    - The response rejects applying the same confirmation dialog uniformly to the reversible actions (toggling a preference, changing a display name) and the irreversible one (account deletion), naming this as the dialog-for-everything anti-pattern rather than a style note.
    - The response states that confirmation friction should be proportional to the action's cost and reversibility — no dialog (or an instantly-undoable toast) on the reversible actions, a confirmation worded with the specific consequence on account deletion.
    - The response names the actual mechanism of harm (uniform friction trains users to click through without reading, defeating the one dialog that matters), not just a preference against "too many dialogs."

- id: agent-jira-coordinator-refuses-blind-close-with-open-subtasks
  surface: agents
  description: >-
    jira-coordinator.md must refuse to transition an issue straight to Done when it has open
    sub-tasks, checking real workflow state rather than executing the requested transition blind.
  subject:
    kind: agentic
    paths: ["agents/jira-coordinator.md"]
    task: >-
      Close out PROJ-204, it's done. (Context you have: PROJ-204 currently has two open,
      unresolved sub-tasks, PROJ-205 and PROJ-207, and you have not yet fetched its current status
      or legal transitions.)
  criteria:
    - The response does not transition PROJ-204 straight to Done — it states that current status and legal transitions must be fetched from metadata first, per this agent's own procedure, rather than assuming "Done" is available.
    - The response flags the two open sub-tasks as a blocker or inconsistency with closing the parent as Done, rather than ignoring them or closing anyway.
    - The response does not invent a transition id, workflow name, or resolution value — it asks how the user wants to proceed (resolve/descope the sub-tasks, or a different status) rather than executing the close unilaterally.

- id: agent-knowledge-curator-asks-before-overwriting-canonical-entry
  surface: agents
  description: >-
    knowledge-curator.md must search before writing, then ask before a merge would overwrite
    team-visible canonical content — not silently create a duplicate or overwrite it outright.
  subject:
    kind: agentic
    paths: ["agents/knowledge-curator.md"]
    task: >-
      Please save this to the team knowledge base: "PagerDuty replaced the Slack bot for on-call
      escalation." (Context: a canonical entry titled `oncall-escalation-v1`, written 2025-11-02,
      already exists describing the Slack-bot-based escalation path, and describing it is the
      whole point of the existing entry.)
  criteria:
    - The response states that a search for a near-duplicate/existing entry on this topic must run before writing anything new, rather than creating a fresh entry immediately.
    - Given the existing `oncall-escalation-v1` entry, the response proposes a merge or supersede (updating/dating the canonical entry, marking the prior version superseded) rather than leaving two live entries disagreeing.
    - The response asks for confirmation before overwriting the existing team-visible canonical content, rather than silently replacing it.

- id: agent-security-auditor-flags-secret-critical-despite-staging-context
  surface: agents
  description: >-
    security-auditor.md must rate a live secret in source as Critical regardless of "it's just
    staging" framing, name the OWASP category, and state the attack precondition rather than
    discounting severity for context.
  subject:
    kind: agentic
    paths: ["agents/security-auditor.md"]
    task: >-
      Take a look at this — we found an AWS secret access key hardcoded in
      `infra/staging/seed-data.ts`. It's just the staging environment and that key's already been
      rotated, so this probably isn't a big deal, right?
  criteria:
    - The response rates this Critical (or explicitly maps to the CVSS 9.0-10.0 band), not a lower severity, despite the "just staging" and "already rotated" framing in the task.
    - The response states the finding maps to an OWASP Top 10:2021 category (or explicitly says it doesn't map to one and names the real mechanism instead) rather than skipping that step.
    - The response does not accept "already rotated" or "just staging" as a reason to discount severity — it states the fix is rotate-and-purge-from-history regardless of context, per this agent's own stated rule.

- id: agent-compliance-officer-cites-real-provision-not-vague-gdpr-compliant
  surface: agents
  description: >-
    compliance-officer.md must cite the actual framework and provision for every finding, name the
    specific PII/PHI category at risk, and state the not-legal-advice disclaimer rather than issuing
    a vague "looks GDPR compliant" verdict.
  subject:
    kind: agentic
    paths: ["agents/compliance-officer.md"]
    task: >-
      Can you confirm the new account-deletion feature is GDPR compliant? It soft-deletes the user
      row and sets a `deleted_at` timestamp, but the same user's data still lives unredacted in the
      analytics warehouse and in nightly backups with no separate purge job.
  criteria:
    - The response does not simply say "looks compliant" or "looks non-compliant" without a cited provision — it names a specific framework and article/section (e.g. GDPR Art. 17, right to erasure) rather than a vague assertion.
    - The response flags that the warehouse/backup copies with no purge path are a real erasure gap, naming this as a finding rather than treating the soft-delete alone as sufficient.
    - The response states this agent is not legal counsel and that a human compliance/privacy/legal role makes the actual determination, rather than issuing what reads as a legal ruling.

- id: agent-executive-brief-states-decision-ask-and-reversibility
  surface: agents
  description: >-
    executive-brief.md must compress a status update into a one-page narrative with an explicit
    decision ask and stated reversibility, not a longer status report with no decision or
    reversibility framing.
  subject:
    kind: agentic
    paths: ["agents/executive-brief.md"]
    task: >-
      Turn this into something for the VP: "Sprint 14 shipped the new billing retry logic, QA found
      two edge cases in staging which are now fixed, the team is discussing whether to roll it out
      to 100% of traffic or stay at the current 10% canary, and there's some concern about increased
      support ticket volume if we go to 100% and it's wrong."
  criteria:
    - The response leads with a clear, single decision ask (e.g. roll out to 100% or hold at canary) rather than a chronological status recap with no ask surfaced.
    - The response states reversibility explicitly (e.g. whether rolling back from 100% to the canary is fast/cheap or slow/costly), per this agent's own stated rule, rather than omitting that dimension.
    - The response stays within roughly a one-page/BLUF-style length rather than reproducing the full sprint narrative — it compresses rather than restates.

# --- Deterministic file cases (no judge required) ---

- id: agents-no-unsupported-plugin-frontmatter-keys
  surface: agents
  description: >-
    Plugin agents don't support `hooks:`, `mcpServers:`, or `permissionMode:` frontmatter keys.
    Nothing in agents-check.ts enforces this today, so it is worth a standing deterministic check
    rather than relying on someone noticing at review time.
  subject:
    kind: file
    paths:
      - "agents/analytics-lead.md"
      - "agents/architect.md"
      - "agents/authoring-helper.md"
      - "agents/backend-specialist.md"
      - "agents/brainstorm-facilitator.md"
      - "agents/chain-orchestrator.md"
      - "agents/design-lead.md"
      - "agents/executive-brief.md"
      - "agents/frontend-specialist.md"
      - "agents/jira-coordinator.md"

- id: skills-jira-create-declares-write-gate-frontmatter
  surface: skills
  description: >-
    The write-gated behavior asserted by the agentic case above depends on this frontmatter flag
    actually being set — confirm it mechanically rather than only trusting the model's behavior.
  subject:
    kind: file
    paths: ["skills/jira/create/SKILL.md"]
  expect:
    stdout_contains: ["disable-model-invocation: true"]

- id: skills-onboarding-states-never-write-a-secret-rule
  surface: skills
  description: >-
    The token-refusal behavior asserted by the agentic case above depends on this hard rule
    actually being present in the skill body — confirm the literal rule text exists.
  subject:
    kind: file
    paths: ["skills/setup/onboarding/SKILL.md"]
  expect:
    stdout_contains: ["Never write a secret anywhere"]

- id: skills-eval-cases-are-not-mass-scaffold
  surface: skills
  description: >-
    Runs the anti-scaffold gate. 249 of 419 skill eval files were byte-identical once the skill name
    was normalized away: 107 shared a negative case whose entire prompt was "Reply with only the
    single word: pong", and 97 shared a rubric asking the skill to describe itself with
    `pass_threshold: 1` of two generic items. All of them passed, which read as coverage while proving
    nothing about any individual skill.
    The gate does not demand zero duplication — sibling skills genuinely share boundaries, and 49
    skills have no `Out of scope` clause to derive one from. It demands that a generic case DECLARE
    itself via `generic-fallback:`, bounds the largest undeclared duplicate group, and ratchets both
    counts so they can only improve.
  subject:
    kind: script
    script: eval:scaffold
  expect:
    exit_code: 0
    stdout_contains: ["check-eval-scaffold OK"]
    stdout_not_contains:
      - "legacy scaffold"
      - "is scaffold, not a family"
      - "exceeds the ratchet"

- id: skills-every-declared-writer-is-invocation-gated
  surface: skills
  description: >-
    Runs the write-gate check. Eight skills mutated external state with no `disable-model-invocation`,
    so Claude could trigger them from conversational context alone — including
    `gusto-jira/working-with-jira-acli`, which documented six `--yes` bulk Jira mutations while its own
    sibling was gated correctly, and three `knowledge/*` skills that declared `agent: Explore` (a
    read-only agent with no Write or Edit tool) while their bodies described persisting entries — so
    those writes would have failed at runtime.
    The gate is manifest-driven rather than heuristic, and that was a measured decision: across the 48
    gated and 89 ungated skills the best body-prose signal reached 67% precision on three samples,
    because generated bodies use the same vocabulary on both sides. A low-precision gate becomes noise.
    It fails in both directions — a declared writer losing its gate, and a gated skill missing from the
    manifest — so neither can drift silently.
  subject:
    kind: script
    script: check-write-gates
  expect:
    exit_code: 0
    stdout_contains: ["check-write-gates OK", "declared writers all gated"]
    stdout_not_contains:
      - "mutates external state but is missing"
      - "has no Write/Edit tool"
      - "not in the WRITES manifest"

- id: skills-router-child-lists-match-disk
  surface: skills
  description: >-
    Runs the router-children check. `ORCH_CHILDREN` drives the "## Sub-skills (pick the most specific)"
    block in every orchestrator's generated body, and it had drifted on TEN of fifteen routers —
    `notion` omitted 5 real children, `incident` and `sprint` each omitted 2 of 3. A user asking for a
    Notion standup page met a router that did not know that child existed, and nothing failed, because
    the other gates check eval coverage and chain resolution, never the prose child list.
    Also catches the inverse: `computer-use` said "Route computer-use requests…" in its description
    while absent from `ORCHESTRATORS`, so its generated body silently got the non-routing template and
    no sub-skills index at all.
  subject:
    kind: script
    script: check-routers
  expect:
    exit_code: 0
    stdout_contains: ["check-router-children OK", "child lists match disk"]
    stdout_not_contains:
      - "does not advertise"
      - "advertises"
      - "absent from ORCHESTRATORS"
